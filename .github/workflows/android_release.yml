name: Build Signed APK and Release

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Nombre de la versión/tag (ej. v2.2.0)'
        required: true
        default: 'v2.2.0'
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build:
    name: Build Signed APK
    environment: Releases
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os, sys
          raw = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not raw:
              print('::error::El secret KEYSTORE_BASE64 está vacío.')
              sys.exit(1)
          clean_b64 = ''.join(raw.split())
          missing_padding = len(clean_b64) % 4
          if missing_padding:
              clean_b64 += '=' * (4 - missing_padding)
          try:
              data = base64.b64decode(clean_b64)
              with open('app/release.jks', 'wb') as f:
                  f.write(data)
              print(f'Keystore decodificado exitosamente ({len(data)} bytes).')
          except Exception as e:
              print(f'::error::No se pudo decodificar KEYSTORE_BASE64: {e}')
              print('Verifica el valor guardado en GitHub Secrets.')
              sys.exit(1)
          "
          file app/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="${{ github.event.pull_request.title }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.2.0"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosynth-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: ${{ (github.event_name == 'pull_request' && github.event.pull_request.body) || 'Release generado automáticamente por GitHub Actions.' }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
