name: Build Signed APK and Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build:
    name: Build Signed APK
    # Solamente si el PR fue mezclado (merged), y el título empieza con v o V
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.title, 'V') || startsWith(github.event.pull_request.title, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Usar printf para evitar que 'echo' agregue nuevas líneas.
          # -i ignora la basura (nuevas líneas), evadiendo el error "Tag number over 30"
          printf "%s" "$KEYSTORE_BASE64" | base64 -d -i > app/release.jks
          # Verificar que se creó correctamente
          file app/release.jks

      - name: Build Release APK
        env:
          # Path relative to the app module directory
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosynth-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.pull_request.title }}
          name: Release ${{ github.event.pull_request.title }}
          body: ${{ github.event.pull_request.body }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
